openapi: 3.0.3
info:
  title: Timetower API
  version: 1.0.0
  description: |
    Schedule and status service for TimeLord Enforcers. All clients authenticate
    with HTTP Basic auth; the username selects the admin or Enforcer role. Users
    are addressed by account name. Timestamps are UTC RFC 3339; durations are
    integer seconds.
servers:
  - url: https://timetower.ogreg.org

paths:
  /api/v1/schedule/{user}:
    get:
      summary: Get a user's schedule
      description: |
        Returns the policy and remaining daily time for the requested account.
      operationId: getSchedule
      security:
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/User'
      responses:
        '200':
          description: Current schedule.
          headers:
            X-Schedule-Revision:
              description: Current schedule revision.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Schedule'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/status/{user}:
    put:
      summary: Report a user's status
      description: |
        Reports one user's session state, current usage counter, and process
        statistics. The response's `X-Schedule-Revision` header tells the
        Enforcer whether it needs to fetch schedules again.
      operationId: putStatus
      security:
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/User'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusRequest'
      responses:
        '200':
          description: Status accepted.
          headers:
            X-Schedule-Revision:
              description: Current schedule revision.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/override/{user}:
    put:
      summary: Override the current day's window and/or limit
      description: |
        Overrides any of the current policy day's start, end, or daily limit.
        All request fields are optional; omitted fields keep the configured
        value or an existing override. For a day with a configured window,
        setting start or end to the configured boundary removes that field's
        override, and setting limit_minutes to the configured limit removes the
        limit override. Clearing every field removes the override entirely.
        `limit_minutes: 0` means no duration limit.
        A start or end override collapses the day's configured windows into one
        interval using the effective boundaries. A day with no configured
        window defaults to 00:00-23:59, so a start or end override creates a
        window and allows that day. Overrides are persisted with usage and are
        keyed by policy day.
      operationId: putOverride
      security:
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/User'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OverrideRequest'
      responses:
        '200':
          description: Override applied.
          headers:
            X-Schedule-Revision:
              description: Current schedule revision.
              schema:
                type: integer
                minimum: 0
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Override'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '422':
          $ref: '#/components/responses/OverrideValidationFailed'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/v1/enforcers:
    get:
      summary: List reporting hosts
      description: |
        Returns every hostname that has reported status, whether it is online,
        its last contact time, and the current state of each user it reports.
      operationId: listEnforcers
      security:
        - BasicAuth: []
      responses:
        '200':
          description: Enforcer status list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnforcerList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/users:
    get:
      summary: List configured users
      description: |
        Returns the configured accounts for the admin console. The display name
        falls back to the account name when it is not configured.
      operationId: listUsers
      security:
        - BasicAuth: []
      responses:
        '200':
          description: Configured user list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /api/v1/history/{user}:
    get:
      summary: Get a user's daily usage history
      description: |
        Returns one entry per policy day, oldest first, ending with the
        current policy day. Days without reports are included with
        `used_seconds: 0`. Usage is aggregated across all hostnames. Usage
        older than the server's retention window is reported as zero.
      operationId: getUsageHistory
      security:
        - BasicAuth: []
      parameters:
        - $ref: '#/components/parameters/User'
        - name: days
          in: query
          required: false
          description: |
            Number of policy days to return, ending with the current policy
            day. Values outside the supported range return `400`.
          schema:
            type: integer
            minimum: 1
            maximum: 400
            default: 7
      responses:
        '200':
          description: Daily usage history.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageHistory'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

components:
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic authentication. The username determines the role: `admin`
        for operator endpoints and `enforcer` for Enforcer endpoints. The
        passwords are TIMELORD_ADMIN_PASSWORD and TIMELORD_ENFORCER_KEY.

  parameters:
    User:
      name: user
      in: path
      required: true
      description: Account name.
      schema:
        type: string

  responses:
    BadRequest:
      description: Malformed request.
    Unauthorized:
      description: Missing or invalid credentials.
    Forbidden:
      description: Authenticated, but the username is not allowed to use this endpoint.
    NotFound:
      description: The user is not configured.
    MethodNotAllowed:
      description: Method not allowed.
    Conflict:
      description: Usage day is later than the server's policy day.
    PayloadTooLarge:
      description: Request body exceeds the configured limit.
    ValidationFailed:
      description: Validation failed.
    OverrideValidationFailed:
      description: Validation failed, or the user has no policy.
    InternalServerError:
      description: Internal server error.
    ServiceUnavailable:
      description: Service unavailable.

  schemas:
    User:
      type: object
      additionalProperties: false
      required: [user, display_name]
      properties:
        user:
          type: string
          example: dani
        display_name:
          type: string
          example: Dani
    UserList:
      type: object
      additionalProperties: false
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/User'
    Window:
      type: object
      additionalProperties: false
      required: [day, start, end]
      properties:
        day:
          type: string
          enum: [mon, tue, wed, thu, fri, sat, sun]
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '08:00'
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '19:00'
    Policy:
      type: object
      additionalProperties: false
      required: [enabled, daily_limit_seconds, windows]
      properties:
        enabled:
          type: boolean
        daily_limit_seconds:
          type: integer
          minimum: 0
          description: |
            Maximum active seconds on the schedule's usage day, converted from
            the configured per-weekday minutes; `0` means no duration limit.
        windows:
          type: array
          items:
            $ref: '#/components/schemas/Window'
      example:
        enabled: true
        daily_limit_seconds: 3600
        windows:
          - {day: mon, start: '08:00', end: '19:00'}
          - {day: tue, start: '08:00', end: '20:30'}
    UsageHistory:
      type: object
      additionalProperties: false
      required: [user, history]
      properties:
        user:
          type: string
        history:
          type: array
          description: Daily totals, oldest first.
          items:
            $ref: '#/components/schemas/UsageDay'
      example:
        user: dani
        history:
          - {day: '2026-11-04', used_seconds: 3900}
          - {day: '2026-11-05', used_seconds: 6600}
          - {day: '2026-11-06', used_seconds: 2700}
          - {day: '2026-11-07', used_seconds: 7200}
          - {day: '2026-11-08', used_seconds: 5400}
          - {day: '2026-11-09', used_seconds: 8400}
          - {day: '2026-11-10', used_seconds: 1500}
    UsageDay:
      type: object
      additionalProperties: false
      required: [day, used_seconds]
      properties:
        day:
          type: string
          format: date
          description: Policy day in the configured time zone.
        used_seconds:
          type: integer
          minimum: 0
          description: Active seconds aggregated across all hostnames.
    UsageState:
      type: object
      required: [day, used_seconds, remaining_seconds]
      properties:
        day:
          type: string
          format: date
        used_seconds:
          type: integer
          minimum: 0
        remaining_seconds:
          type: integer
          minimum: 0
          nullable: true
          description: Remaining seconds for the day; `null` when there is no daily limit.
    Schedule:
      type: object
      required:
        [schema_version, server_time, timezone, status_interval_seconds,
         offline_grace_seconds, user, policy, usage]
      properties:
        schema_version:
          type: integer
          example: 1
        server_time:
          type: string
          format: date-time
        timezone:
          type: string
          example: Europe/Budapest
        status_interval_seconds:
          type: integer
          minimum: 1
        offline_grace_seconds:
          type: integer
          minimum: 0
        user:
          type: string
        policy:
          type: object
          allOf:
            - $ref: '#/components/schemas/Policy'
          nullable: true
        usage:
          $ref: '#/components/schemas/UsageState'
      example:
        schema_version: 1
        server_time: '2026-11-10T08:00:00Z'
        timezone: Europe/Budapest
        status_interval_seconds: 60
        offline_grace_seconds: 86400
        user: dani
        policy:
          enabled: true
          daily_limit_seconds: 3600
          windows:
            - {day: mon, start: '08:00', end: '19:00'}
        usage:
          day: '2026-11-10'
          used_seconds: 1500
          remaining_seconds: 2100
    ProcessStat:
      type: object
      additionalProperties: false
      required: [name, scope, instances, memory_rss_bytes, cpu_seconds_total]
      properties:
        name:
          type: string
        scope:
          type: string
          enum: [app, system]
        instances:
          type: integer
          minimum: 0
        memory_rss_bytes:
          type: integer
          minimum: 0
        cpu_seconds_total:
          type: number
          minimum: 0
    StatusRequest:
      type: object
      additionalProperties: false
      required:
        [observed_at, enforcer_version, hostname, active, locked,
         session_count, usage_seconds, processes]
      properties:
        observed_at:
          type: string
          format: date-time
        enforcer_version:
          type: string
        hostname:
          type: string
          maxLength: 256
        active:
          type: boolean
        locked:
          type: boolean
        session_count:
          type: integer
          minimum: 0
        usage_seconds:
          type: integer
          minimum: 0
          description: Active seconds for the policy day inferred from `observed_at`.
        collected_in_ms:
          type: integer
          minimum: 0
        processes:
          type: array
          description: Process statistics for the user in the path.
          items:
            $ref: '#/components/schemas/ProcessStat'
      example:
        observed_at: '2026-11-10T08:15:00Z'
        enforcer_version: 0.2.0
        hostname: dani
        active: true
        locked: false
        session_count: 1
        usage_seconds: 1234
        collected_in_ms: 120
        processes:
          - name: firefox
            scope: app
            instances: 5
            memory_rss_bytes: 734003200
            cpu_seconds_total: 456.7
    DenyReason:
      type: string
      nullable: true
      enum: [no_policy, disabled, outside_window, daily_limit_reached]
    OverrideRequest:
      type: object
      additionalProperties: false
      properties:
        start:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '10:00'
          description: New start for the current day's window.
        end:
          type: string
          pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
          example: '18:00'
          description: New end for the current day's window.
        limit_minutes:
          type: integer
          minimum: 0
          description: |
            Effective daily limit in minutes for the current policy day. `0`
            means no duration limit. The configured default removes this
            override field.
      example:
        start: '10:00'
        end: '18:00'
        limit_minutes: 15
    Override:
      type: object
      required: [user, day, windows, limit_minutes]
      properties:
        user:
          type: string
        day:
          type: string
          format: date
          description: Current policy day the override applies to.
        windows:
          type: array
          description: Effective windows for the current policy day.
          items:
            $ref: '#/components/schemas/Window'
        limit_minutes:
          type: integer
          minimum: 0
          description: Effective limit in minutes for the current policy day.
      example:
        user: dani
        day: '2026-11-10'
        windows:
          - {day: mon, start: '10:00', end: '18:00'}
        limit_minutes: 15
    StatusResponse:
      type: object
      required:
        [server_time, server_day, user, current_day, reported_used_seconds,
         aggregate_used_seconds, daily_limit_seconds, remaining_seconds,
         inside_window, allowed, deny_reason]
      properties:
        server_time:
          type: string
          format: date-time
        server_day:
          type: string
          format: date
        user:
          type: string
        current_day:
          type: string
          format: date
        reported_used_seconds:
          type: integer
          minimum: 0
        aggregate_used_seconds:
          type: integer
          minimum: 0
        daily_limit_seconds:
          type: integer
          minimum: 0
        remaining_seconds:
          type: integer
          minimum: 0
          nullable: true
        inside_window:
          type: boolean
        allowed:
          type: boolean
        deny_reason:
          $ref: '#/components/schemas/DenyReason'
      example:
        server_time: '2026-11-10T08:15:01Z'
        server_day: '2026-11-10'
        user: dani
        current_day: '2026-11-10'
        reported_used_seconds: 1234
        aggregate_used_seconds: 1500
        daily_limit_seconds: 3600
        remaining_seconds: 2100
        inside_window: false
        allowed: false
        deny_reason: outside_window
    EnforcerList:
      type: object
      required: [server_time, server_day, enforcers]
      properties:
        server_time:
          type: string
          format: date-time
        server_day:
          type: string
          format: date
        enforcers:
          type: array
          items:
            $ref: '#/components/schemas/EnforcerStatus'
      example:
        server_time: '2026-11-10T08:15:01Z'
        server_day: '2026-11-10'
        enforcers:
          - hostname: dani
            online: true
            last_seen: '2026-11-10T08:15:00Z'
            users:
              - user: dani
                used_seconds: 1500
                daily_limit_seconds: 3600
                remaining_seconds: 2100
                inside_window: false
                allowed: false
                deny_reason: outside_window
    EnforcerStatus:
      type: object
      required: [hostname, online, last_seen, users]
      properties:
        hostname:
          type: string
        online:
          type: boolean
        last_seen:
          type: string
          format: date-time
          nullable: true
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserStatus'
    UserStatus:
      type: object
      required:
        [user, used_seconds, daily_limit_seconds, remaining_seconds,
         inside_window, allowed, deny_reason]
      properties:
        user:
          type: string
        used_seconds:
          type: integer
          minimum: 0
        daily_limit_seconds:
          type: integer
          minimum: 0
        remaining_seconds:
          type: integer
          minimum: 0
          nullable: true
        inside_window:
          type: boolean
        allowed:
          type: boolean
        deny_reason:
          $ref: '#/components/schemas/DenyReason'
