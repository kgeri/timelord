# AI sandbox config. Copy to .sandbox.conf next to ./pi-sandbox and commit it.
# Read by pi-sandbox on the host and mounted read-only in the sandbox, so it is
# visible to the agent: keep secrets in .sandbox.env instead (see below).

# Allowlisted outbound domains. Empty/missing uses the built-in default
# (api.deepseek.com plus the Maven Central, PyPI, Go, npm and Gradle registry
# hosts below); `none` denies all egress.
[allow_domains]
api.deepseek.com
repo.maven.apache.org                   # Maven Central
pypi.org                                # pip
files.pythonhosted.org                  # pip downloads
proxy.golang.org                        # Go modules
sum.golang.org                          # Go checksum DB
registry.npmjs.org                      # npm
plugins.gradle.org                      # Gradle plugin portal
services.gradle.org                     # Gradle wrapper distribution URL
github.com                              # ...redirects to GitHub releases
release-assets.githubusercontent.com    # ...final asset CDN
api.foojay.io                           # Java toolchain auto-provisioning

# Extra host directories mounted read-only at the same path. The CWD is always rw.
[extra_ro_dirs]
# /data/models
# /srv/datasets

# Files whose contents are hidden from the agent: they are mounted as empty,
# read-only files. Patterns without '/' match basenames at any depth; a pattern
# with '/' is relative to the workspace; a leading '/' is an absolute path.
# Prefix a pattern with '!' to exclude it. Missing/empty uses the default
#   .env .env.* *.env !.env.example !.env.sample !.env.template !.env.dist
# `none` disables masking (the file names stay visible either way).
[masked_paths]
# .env
# .env.*
# *.env
# !.env.example
# secrets/*.txt
# /home/you/other-project/.env

# Git identity for commits made inside the sandbox. name/email default to the
# host's global git config; set either to override. `config` optionally includes
# a full host gitconfig (same source syntax as .sandbox.env); its content becomes
# visible to the agent, so keep credentials out of it.
[git]
# name   = Jane Doe
# email  = jane@example.com
# config = @~/.gitconfig

# Secrets are not listed here. Put them in .sandbox.env (gitignored and masked in
# the sandbox); see .sandbox.env.example.
